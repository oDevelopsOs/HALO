[package]
name = "agentguard-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "BUSL-1.1"
description = "AgentGuard security daemon — kernel-level protection against rogue AI agents"
repository.workspace = true

[lib]
name = "agentguard_daemon"
path = "src/lib.rs"

[[bin]]
name = "agentguard-daemon"
path = "src/main.rs"

[dependencies]
agentguard-common = { path = "../agentguard-common" }

tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
    "time",
] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
blake3 = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
interprocess = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }

# Userspace fallback para filesystem watching (kernels sin BPF LSM).
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# aya se añade en fase 1.5 cuando llegue kernel_loader.rs
# aya = "0.13"
# aya-log = "0.2"
libc = "0.2"
nix = { version = "0.29", features = ["user", "signal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[features]
default = []
# `ebpf` habilita el backend kernel con aya. Sin esta feature el daemon
# compila pero usa el fallback userspace basado en `notify`.
ebpf = []
