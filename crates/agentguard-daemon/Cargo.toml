[package]
name = "agentguard-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "BUSL-1.1"
description = "AgentGuard security daemon — kernel-level protection against rogue AI agents"
repository.workspace = true

[lib]
name = "agentguard_daemon"
path = "src/lib.rs"

[[bin]]
name = "agentguard-daemon"
path = "src/main.rs"

[dependencies]
agentguard-common = { path = "../agentguard-common" }

tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
    "time",
] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
blake3 = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
interprocess = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }

# Userspace fallback para filesystem watching (kernels sin BPF LSM).
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
async-trait = "0.1"

# HTTP DLP proxy (hyper 1.x).
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
once_cell = "1"

# CA root + leaf cert generation para HTTPS MITM (Fase 2.2 + 2.3).
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "aws_lc_rs", "x509-parser"] }
time = "0.3"

# TLS para HTTPS MITM (Fase 2.3).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-tokio", "native-tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# aya se activa con --features ebpf (Fase 1.5+).
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }
libc = "0.2"
nix = { version = "0.29", features = ["user", "signal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[features]
default = []
# `ebpf` habilita el backend kernel con aya. Sin esta feature el daemon
# compila pero usa el fallback userspace basado en `notify`.
ebpf = ["aya", "aya-log"]
