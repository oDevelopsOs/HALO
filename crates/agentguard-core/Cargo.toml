[package]
name = "agentguard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "BUSL-1.1"
description = "AgentGuard core library — shared daemon logic (vault, DLP, CA, IPC, config, events)"
repository.workspace = true

[lib]
name = "agentguard_core"
path = "src/lib.rs"

[dependencies]
agentguard-common = { path = "../agentguard-common" }

tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
    "time",
] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
blake3 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
interprocess = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }

# Userspace fallback para filesystem watching (guard trait, no impls).
notify = { version = "6", default-features = false }
async-trait = "0.1"

# HTTP DLP proxy (hyper 1.x).
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
once_cell = "1"

# CA root + leaf cert generation para HTTPS MITM.
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "aws_lc_rs", "x509-parser"] }
time = "0.3"

# TLS para HTTPS MITM.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-tokio", "native-tokio"] }

# Auto-updater (Fase 7)
ureq = { version = "3", features = ["_tls", "gzip"] }
hex = "0.4"
flate2 = "1"
tar = "0.4"

# OTA profiles (Fase 3)
ed25519-dalek = "2"

# Local database (Fase 5)
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"

# Platform-specific para procesos (kill)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user", "signal"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
