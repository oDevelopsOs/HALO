[package]
name = "agentguard-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "BUSL-1.1"
description = "AgentGuard daemon for Linux — eBPF LSM + userspace fallback"
repository.workspace = true

[[bin]]
name = "agentguard-linux"
path = "src/main.rs"

[dependencies]
agentguard-common = { path = "../agentguard-common" }
agentguard-core = { path = "../agentguard-core" }

tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
    "time",
] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
dirs = { workspace = true }
clap = { workspace = true }

async-trait = "0.1"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
libc = "0.2"
nix = { version = "0.29", features = ["user", "signal"] }

# eBPF backend (feature for conditional compilation)
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[features]
default = []
ebpf = ["aya", "aya-log"]
