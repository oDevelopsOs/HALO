[package]
name = "agentguard-ebpf"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "AgentGuard eBPF LSM programs (kernel-side)"
publish = false

# Este crate se compila SEPARADO del workspace principal, con:
#   cargo +nightly build --release --target bpfel-unknown-none -Z build-std=core
#
# Está excluido del [workspace] raíz porque el target bpfel-unknown-none
# es incompatible con muchas dependencias userspace (tokio, etc.).

[[bin]]
name = "file_guard"
path = "src/file_guard.rs"

[[bin]]
name = "net_guard"
path = "src/net_guard.rs"

[dependencies]
# Fase 1.5: aquí entra aya-bpf + aya-log-ebpf.
# Por ahora el crate compila para target nativo como stub vacío.
agentguard-common = { path = "../agentguard-common", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
