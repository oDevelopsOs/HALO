[package]
name = "agentguard-ebpf"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "AgentGuard eBPF LSM programs (kernel-side)"
publish = false

# Este crate se compila con:
#   cargo +nightly build --release --target bpfel-unknown-none -Z build-std=core
#
# Desde el workspace raíz: scripts/build-ebpf.sh
#
# Está excluido del [workspace] porque bpfel-unknown-none es incompatible
# con dependencias userspace (tokio, etc.).

[[bin]]
name = "file_guard"
path = "src/file_guard.rs"

[[bin]]
name = "net_guard"
path = "src/net_guard.rs"

[[bin]]
name = "process_exec"
path = "src/process_exec.rs"

[dependencies]
aya-ebpf = "0.1"
agentguard-common = { path = "../agentguard-common", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
