[package]
name = "agentguard-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "BUSL-1.1"
description = "AgentGuard daemon for Windows — NTFS DENY ACEs + Job Objects (Fase 4)"
repository.workspace = true

[[bin]]
name = "agentguard-windows"
path = "src/main.rs"

[dependencies]
agentguard-common = { path = "../agentguard-common" }
agentguard-core = { path = "../agentguard-core" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait = "0.1"
clap = { workspace = true }
notify = { version = "6", default-features = false }
dirs = { workspace = true }

# Windows-specific
windows = { version = "0.58", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
] }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
thiserror = { workspace = true }
