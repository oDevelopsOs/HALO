[package]
name = "agentguard-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "BUSL-1.1"
description = "AgentGuard daemon for Windows — NTFS DENY ACEs + Job Objects (Fase 4)"
repository.workspace = true

[[bin]]
name = "agentguard-windows"
path = "src/main.rs"

[dependencies]
agentguard-common = { path = "../agentguard-common" }
agentguard-core = { path = "../agentguard-core" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "net", "time"] }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait = "0.1"
clap = { workspace = true }

# Windows-specific
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
] }
