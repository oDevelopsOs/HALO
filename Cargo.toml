[workspace]
resolver = "2"
members = [
    "crates/agentguard-common",
    "crates/agentguard-core",
    "crates/agentguard-linux",
    "crates/agentguard-windows",   # Fase 4 activa
    "crates/agentguard-cli",
    "crates/agentguard-installer",
    "crates/agentguard-tui",
]
# agentguard-ebpf se compila por separado con nightly + target bpfel-unknown-none
exclude = ["crates/agentguard-ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["AgentGuard Contributors"]
license = "BUSL-1.1"
repository = "https://github.com/tuorg/agentguard"
homepage = "https://agentguard.io"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", default-features = false }

# Serialization
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Hashing
blake3 = "1"
sha2 = "0.10"

# Regex
regex = "1"

# Paths
dirs = "5"

# IPC
interprocess = "2"

# Time / IDs
uuid = { version = "1", features = ["v4"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
