name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Format check ────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ──────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude agentguard-ebpf --all-targets -- -D warnings

  # ── No unwrap/panic guard ───────────────────────────────
  no-panic:
    name: panic-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-panic.sh

  # ── Test matrix (per OS) ────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude agentguard-ebpf
      - run: cargo test --workspace --exclude agentguard-ebpf

  # ── Linux daemon build ──────────────────────────────────
  linux-daemon:
    name: linux-daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p agentguard-linux

  # ── eBPF bytecode (nightly) ─────────────────────────────
  ebpf-build:
    name: ebpf (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: bpfel-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Build eBPF bytecode
        working-directory: crates/agentguard-ebpf
        run: cargo +nightly build --release --target bpfel-unknown-none -Z build-std=core

  # ── CLI integration test (build + init) ─────────────────
  cli-test:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p agentguard-cli
      - name: Test init generates valid config
        run: |
          cargo run -q -p agentguard-cli -- init --output /tmp/ag-test.toml
          grep -q "protected_dirs" /tmp/ag-test.toml || exit 1
          grep -q "AgentGuard" /tmp/ag-test.toml || exit 1
          rm /tmp/ag-test.toml
      - name: Test init rejects existing file
        run: |
          echo "x" > /tmp/existing.toml
          cargo run -q -p agentguard-cli -- init --output /tmp/existing.toml && exit 1 || true

  # ── Installer build ─────────────────────────────────────
  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p agentguard-installer
